<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Gera Senha</title>
</head>
<body>
    
        <div class="parametro">
            <div class="header">
                <h1>Gera Senha</h1>
            </div>
    
            <div class="display-box">
                <span id="password">Senha</span>
                <button class="copy-btn" id="copyBtn" title="Copiar">Copiar</button>
            </div>

            <div class="custom-section">
                <h2>Personalize sua senha</h2>

                <div class="control-group">
                    <span class="control-label">Número de caracteres</span>

                    <div class="counter">
                        <button id="decrement">-</button>
                        <span id="lengthVal">12</span>
                        <button id="increment">+</button>
                    </div>
            </div>

            <button class="generate-btn" id="generate-Btn">Gerar Nova Senha</button>
            </div>
        </div>
</body>
</html>
